<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Enquiry Form</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; color: #333; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 500; margin-bottom: 6px; color: #444; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: #0d6efd; }
    textarea { min-height: 80px; resize: vertical; }
    button { width: 100%; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    .message { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
    .message.success { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
    .message.error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    .note { background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 12px; color: #495057; }
  </style>
</head>
<body>
  <h1>Contact Enquiry Form</h1>

  <div class="note">
    Set <code>API_BASE_URL</code> and <code>API_KEY</code> in script once, then copy-paste this form.
  </div>

  <div id="msgBox" class="message"></div>

  <form id="enquiryForm">
    <h3 style="font-size:1rem;margin-bottom:12px">Required fields</h3>
    <div class="form-group">
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" name="fullName" required maxlength="200" placeholder="John Doe">
    </div>
    <div class="form-group">
      <label for="mobileNumber">Mobile Number *</label>
      <input type="tel" id="mobileNumber" name="mobileNumber" required maxlength="20" placeholder="+919876543210">
      <small style="color:#6c757d">Use E.164 format, e.g. +919876543210</small>
    </div>
    <div class="form-group">
      <label for="emailId">Email *</label>
      <input type="email" id="emailId" name="emailId" required maxlength="255" placeholder="john@example.com">
    </div>
    <div class="form-group">
      <label id="captchaQuestion" for="captchaAnswer">Captcha *</label>
      <input type="text" id="captchaAnswer" name="captchaAnswer" required maxlength="20" placeholder="Type captcha answer">
      <small id="captchaMeta" style="color:#6c757d"></small>
    </div>

    <h3 style="font-size:1rem;margin:20px 0 12px">Extra fields (stored in RawPayload)</h3>
    <p style="font-size:13px;color:#6c757d;margin-bottom:12px">Add any custom fields – they are saved as JSON and shown in Enquiry details.</p>
    <div class="form-group">
      <label for="enquiryMessage">Message</label>
      <textarea id="enquiryMessage" name="enquiryMessage" placeholder="Your message or query..."></textarea>
    </div>
    <div class="form-group">
      <label for="company">Company</label>
      <input type="text" id="company" name="company" placeholder="Acme Inc">
    </div>
    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Product enquiry">
    </div>
    <div class="form-group">
      <label for="productInterest">Product / Service of Interest</label>
      <input type="text" id="productInterest" name="productInterest" placeholder="e.g. Website Design">
    </div>
    <div class="form-group">
      <button type="submit" id="submitBtn">Submit Enquiry</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('enquiryForm');
    const msgBox = document.getElementById('msgBox');
    const submitBtn = document.getElementById('submitBtn');
    // ===== Production config: change these 2 values only =====
    const API_BASE_URL = 'https://intranet.ordbusinesshub.com';
    const API_KEY = 'PASTE_API_KEY_HERE';

    const REQUEST_TIMEOUT_MS = 15000;
    const EXTRA_FIELD_IDS = ['enquiryMessage', 'company', 'subject', 'productInterest'];

    // Add hidden bot-trap, CSRF, and captcha-id fields so copied form works anywhere.
    const honeypotInput = document.createElement('input');
    honeypotInput.type = 'text';
    honeypotInput.name = 'website';
    honeypotInput.autocomplete = 'off';
    honeypotInput.tabIndex = -1;
    honeypotInput.style.position = 'absolute';
    honeypotInput.style.left = '-9999px';
    honeypotInput.style.opacity = '0';
    form.appendChild(honeypotInput);

    const csrfInput = document.createElement('input');
    csrfInput.type = 'hidden';
    csrfInput.name = 'csrfToken';
    form.appendChild(csrfInput);

    const captchaIdInput = document.createElement('input');
    captchaIdInput.type = 'hidden';
    captchaIdInput.name = 'captchaId';
    form.appendChild(captchaIdInput);

    function showMessage(text, isError = false) {
      msgBox.textContent = text;
      msgBox.className = 'message ' + (isError ? 'error' : 'success');
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      msgBox.style.display = 'none';
    }

    function setSubmitLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? 'Submitting...' : 'Submit Enquiry';
    }

    function generateCsrfToken() {
      const bytes = new Uint8Array(32);
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    function validateInput() {
      const fullName = document.getElementById('fullName').value.trim();
      const mobileNumber = document.getElementById('mobileNumber').value.trim();
      const emailId = document.getElementById('emailId').value.trim();

      if (!fullName || fullName.length > 200) {
        return 'Please enter a valid full name (max 200 chars).';
      }
      if (!/^\+?[1-9]\d{1,14}$/.test(mobileNumber)) {
        return 'Please enter a valid mobile number in E.164 format.';
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailId) || emailId.length > 255) {
        return 'Please enter a valid email address.';
      }
      return null;
    }

    function buildPayload(csrfToken) {
      const extra = {};
      for (const id of EXTRA_FIELD_IDS) {
        const el = document.getElementById(id);
        if (el && el.value && el.value.trim()) {
          extra[el.name || id] = el.value.trim();
        }
      }

      const payload = {
        fullName: document.getElementById('fullName').value.trim(),
        mobileNumber: document.getElementById('mobileNumber').value.trim(),
        emailId: document.getElementById('emailId').value.trim(),
        source: 'website',
        // Auto-detect domain where this HTML is hosted.
        referrerUrl: window.location.origin,
        captchaId: captchaIdInput.value,
        captchaAnswer: document.getElementById('captchaAnswer').value.trim(),
        csrfToken: csrfToken,
        honeypot: honeypotInput.value || ''
      };

      if (Object.keys(extra).length > 0) {
        payload.rawPayload = extra;
      }
      return payload;
    }

    async function loadCaptchaChallenge() {
      const captchaQuestion = document.getElementById('captchaQuestion');
      const captchaMeta = document.getElementById('captchaMeta');
      captchaQuestion.textContent = 'Captcha * (loading...)';
      captchaMeta.textContent = '';
      captchaIdInput.value = '';

      const response = await fetchWithTimeout(
        API_BASE_URL.replace(/\/$/, '') + '/api/enquiries/captcha-challenge',
        {
          method: 'GET',
          headers: {
            'X-API-Key': API_KEY
          }
        },
        REQUEST_TIMEOUT_MS
      );

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data || !data.data || !data.data.captchaId || !data.data.question) {
        throw new Error(data.message || 'Unable to load captcha challenge.');
      }

      captchaIdInput.value = data.data.captchaId;
      captchaQuestion.textContent = 'Captcha *: ' + data.data.question;
      captchaMeta.textContent = 'Captcha expires in ~5 minutes.';
    }

    async function fetchWithTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timeoutId);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      if (!API_BASE_URL || API_BASE_URL.indexOf('PASTE_') !== -1) {
        showMessage('API_BASE_URL is not configured in script.', true);
        return;
      }
      if (!API_KEY || API_KEY.indexOf('PASTE_') !== -1) {
        showMessage('API_KEY is not configured in script.', true);
        return;
      }
      if (!document.getElementById('captchaAnswer').value.trim()) {
        showMessage('Please solve captcha.', true);
        return;
      }

      const validationError = validateInput();
      if (validationError) {
        showMessage(validationError, true);
        return;
      }

      if (honeypotInput.value) {
        showMessage('Enquiry submitted successfully!');
        return;
      }

      setSubmitLoading(true);

      try {
        const csrfToken = generateCsrfToken();
        csrfInput.value = csrfToken;

        if (!captchaIdInput.value) {
          await loadCaptchaChallenge();
        }
        const payload = buildPayload(csrfToken);

        const response = await fetchWithTimeout(
          API_BASE_URL.replace(/\/$/, '') + '/api/enquiries',
          {
            method: 'POST',
            headers: {
              'X-API-Key': API_KEY,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          },
          REQUEST_TIMEOUT_MS
        );

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          showMessage('Enquiry submitted successfully! ID: ' + (data.data?.id || 'N/A'));
          form.reset();
          await loadCaptchaChallenge();
        } else {
          showMessage(data.message || ('Failed to submit enquiry (HTTP ' + response.status + ').'), true);
          await loadCaptchaChallenge();
        }
      } catch (err) {
        if (err && err.name === 'AbortError') {
          showMessage('Request timed out. Please try again.', true);
        } else {
          showMessage('Network/security error: ' + ((err && err.message) || 'Could not submit enquiry.'), true);
        }
        try { await loadCaptchaChallenge(); } catch (_) {}
      } finally {
        setSubmitLoading(false);
      }
    });

    // Load first captcha challenge on page load.
    loadCaptchaChallenge().catch((err) => {
      showMessage('Captcha init failed: ' + ((err && err.message) || 'Unknown error'), true);
    });
  </script>
</body>
</html>
